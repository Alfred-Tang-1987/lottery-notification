# docker-compose（spec §4.3 / plan 06 T9）
# 端口 8280 / restart: always / 持久化卷 / .env 注入密钥

services:
  app:
    build: .
    container_name: lottery-notification
    ports:
      - "8280:8280"
    volumes:
      - ./data:/app/data          # SQLite 持久化（spec §4.3）
      - ./backups:/app/backups    # 备份目录（spec §4.3：每日备份保留 30 天）
    env_file: .env                # CLAUDE.md：密钥从 .env 注入，不进库不进日志
    # spec §4.3：FnOS 关机会 docker stop 所有容器，unless-stopped 不会自启——必须 always。
    # silent-failure 陷阱：误改 unless-stopped 不会立即崩，但 NAS 重启后服务静默消失，
    # 用户错过开奖通知。tests/test_docker_t9.py::test_compose_restart_always 是此陷阱的护栏。
    restart: always
