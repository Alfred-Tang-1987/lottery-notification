[project]
name = "lottery-notification"
version = "0.1.0"
description = "兑奖了吗？— 彩票开奖自动核对与通知"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "cryptography>=43",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "import-linter>=2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# E501: line-length 由 formatter 管；RUF001/002/003: 中文全角标点误报（中文项目必须 ignore）；
# B008: FastAPI Depends() 默认参数是官方推荐模式；B017: 测试里 pytest.raises(Exception) 测通用异常是惯例。
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "single"

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Domain layer is pure (no IO)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.infrastructure", "app.adapters", "app.api", "app.services"]
