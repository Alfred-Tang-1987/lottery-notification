[project]
name = "lottery-notification"
version = "0.1.0"
description = "兑奖了吗？— 彩票开奖自动核对与通知"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "cryptography>=43",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "import-linter>=2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
